name: Living Documentation

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/landing/**'
      - 'packages/extension/src/test/e2e/**'
      - 'packages/extension/scripts/finalize-docs.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
  workflow_dispatch:

jobs:
  build-and-document:
    runs-on: ubuntu-22.04
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq

          # Ubuntu 24.04 renamed libasound2 to libasound2t64. Keep compatibility.
          if apt-cache show libasound2 >/dev/null 2>&1; then
            AUDIO_PKG=libasound2
          else
            AUDIO_PKG=libasound2t64
          fi

          sudo apt-get install -y --no-install-recommends \
            freecad \
            openscad \
            xvfb \
            "$AUDIO_PKG" \
            libgbm1 \
            libnss3 \
            libxss1
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Install Playwright Browsers & Electron Deps
        run: pnpm --filter omni-cad exec playwright install --with-deps electron
        
      - name: Build Monorepo
        run: pnpm run build
        
      - name: Run E2E Stories & Sync Docs
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
          pnpm run test:e2e
          
      - name: Upload Documentation Assets
        uses: actions/upload-artifact@v4
        with:
          name: documentation-videos
          path: packages/landing/public/videos/*.webm
          
      - name: Build Documentation Site
        run: pnpm --filter @omni-cad/landing run build
        env:
          VITE_BASE_PATH: /omni-cad/channels/develop/
          VITE_DOCS_VERSION: develop
          VITE_DOCS_CHANNEL: develop

      - name: Validate base-path output
        run: |
          grep -q '/omni-cad/channels/develop/' packages/landing/dist/index.html
