name: CI

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lint:
    name: Lint Workspace
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4


      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace lint
        run: pnpm lint

  test:
    name: Test Workspace
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4


      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace tests
        run: pnpm test

      - name: Validate agent workflow
        run: pnpm test:agents

      - name: Run extension coverage
        run: pnpm --filter omni-cad run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build:
    name: Build And Package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4


      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Package extension VSIX
        run: pnpm --filter omni-cad run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: omni-cad-vsix
          path: packages/extension/*.vsix
          retention-days: 7

  e2e:
    name: Extension E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4


      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install system dependencies for Electron
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libgtk-3-0 \
            libxss1 \
            libasound2t64 \
            libgbm1 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxrandr2 \
            libxdamage1 \
            libxfixes3 \
            libnss3 \
            libnspr4 \
            libdbus-1-3

      - name: Cache VS Code test downloads
        uses: actions/cache@v4
        with:
          # VS Code is downloaded by @vscode/test-electron into the package's
          # local .vscode-test dir, not ~/.vscode-test.  Caching the correct
          # path avoids a 200 MB re-download on every CI run.
          path: packages/extension/.vscode-test
          key: vscode-test-${{ runner.os }}-stable

      - name: Run extension E2E
        run: xvfb-run -a pnpm --filter omni-cad run test:e2e
        env:
          # Force Mesa software OpenGL so WebGL works without a physical GPU.
          LIBGL_ALWAYS_SOFTWARE: "1"

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: packages/extension/test-results/
          retention-days: 7
