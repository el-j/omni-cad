name: Release

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ── Gates: lint + unit tests ──────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4


      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4


      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Validate agent workflow
        run: pnpm test:agents

  # ── Semantic Release ──────────────────────────────────────────────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [lint, test]
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      new_release_git_tag: ${{ steps.semantic.outputs.new_release_git_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4


      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Debug Branch Resolution
        run: |
          echo "╔════════════════════════════════════════════════════════╗"
          echo "║ semantic-release Branch Resolution                     ║"
          echo "╚════════════════════════════════════════════════════════╝"
          echo ""
          echo "Current branch: ${{ github.ref_name }}"
          echo ""
          node -e "
            const config = require('./.releaserc.js');
            const branch = '${{ github.ref_name }}';
            const patterns = [
              { pattern: 'main', exact: true },
              { pattern: 'develop', exact: true },
              { pattern: 'feature/*', glob: true },
              { pattern: 'fix/*', glob: true }
            ];
            
            let matched = null;
            for (const { pattern, exact, glob } of patterns) {
              if (exact && branch === pattern) {
                matched = pattern;
                break;
              }
              if (glob) {
                const regex = pattern.replace('*', '.*');
                if (new RegExp('^' + regex + '$').test(branch)) {
                  matched = pattern;
                  break;
                }
              }
            }
            
            const branchConfig = config.branches.find(b => b.name === matched);
            
            console.log('Branch Pattern Match:');
            console.log('  Pattern: ' + (matched || 'NONE'));
            console.log('  Channel: ' + (branchConfig?.channel || 'none'));
            if (branchConfig?.prerelease) {
              console.log('  Prerelease: ' + branchConfig.prerelease);
              console.log('  Release Type: Prerelease');
            } else {
              console.log('  Release Type: Production');
            }
            console.log('');
            console.log('Configured Branches:');
            config.branches.forEach(b => {
              const pre = b.prerelease ? ' (prerelease: ' + b.prerelease + ')' : '';
              console.log('  ' + b.name + ' → ' + b.channel + pre);
            });
          "

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com

  # ── Build & Publish .vsix ─────────────────────────────────────────────────
  publish-vsix:
    name: Build & Attach .vsix to Release
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new_release_published == 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the release tag so package.json has the bumped version
          ref: ${{ needs.release.outputs.new_release_git_tag }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension bundles
        run: pnpm --filter omni-cad run compile

      - name: Package .vsix
        run: pnpm --filter omni-cad run package

      - name: Upload .vsix to GitHub Release
        run: |
          gh release upload "${{ needs.release.outputs.new_release_git_tag }}" \
            packages/extension/*.vsix \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── SBOM ─────────────────────────────────────────────────────────────────
  sbom:
    name: Generate & Attach SBOM
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new_release_published == 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.new_release_git_tag }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json

      - name: Upload SBOM to GitHub Release
        run: |
          gh release upload "${{ needs.release.outputs.new_release_git_tag }}" \
            sbom.cdx.json \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docs:
    name: Publish Versioned Docs
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.new_release_git_tag }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve docs channel alias
        id: channel
        run: |
          case "${GITHUB_REF_NAME}" in
            main)      echo "channel=prod" >> "$GITHUB_OUTPUT" ;;
            develop)   echo "channel=beta" >> "$GITHUB_OUTPUT" ;;
            feature/*) echo "channel=alpha" >> "$GITHUB_OUTPUT" ;;
            fix/*)     echo "channel=alpha" >> "$GITHUB_OUTPUT" ;;
            *)         echo "channel=alpha" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build docs for release version
        run: pnpm --filter @omni-cad/landing run build
        env:
          VITE_BASE_PATH: /omni-cad/versions/${{ needs.release.outputs.new_release_git_tag }}/
          VITE_DOCS_VERSION: ${{ needs.release.outputs.new_release_git_tag }}
          VITE_DOCS_CHANNEL: release

      - name: Capture release docs build
        run: |
          rm -rf /tmp/docs-version
          mkdir -p /tmp/docs-version
          cp -R packages/landing/dist/. /tmp/docs-version/

      - name: Build docs for channel alias
        run: pnpm --filter @omni-cad/landing run build
        env:
          VITE_BASE_PATH: /omni-cad/channels/${{ steps.channel.outputs.channel }}/
          VITE_DOCS_VERSION: ${{ needs.release.outputs.new_release_git_tag }}
          VITE_DOCS_CHANNEL: ${{ steps.channel.outputs.channel }}

      - name: Capture channel docs build
        run: |
          rm -rf /tmp/docs-channel
          mkdir -p /tmp/docs-channel
          cp -R packages/landing/dist/. /tmp/docs-channel/

      - name: Restore existing published site
        run: |
          mkdir -p .pages-site
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add /tmp/gh-pages origin/gh-pages
            cp -R /tmp/gh-pages/. .pages-site/
            git worktree remove /tmp/gh-pages --force
          fi

      - name: Merge release version snapshot
        run: |
          node scripts/docs/merge-versioned-site.mjs \
            --site .pages-site \
            --dist /tmp/docs-version \
            --id ${{ needs.release.outputs.new_release_git_tag }} \
            --label ${{ needs.release.outputs.new_release_git_tag }} \
            --kind version \
            --path versions/${{ needs.release.outputs.new_release_git_tag }}/

      - name: Merge channel alias snapshot
        run: |
          node scripts/docs/merge-versioned-site.mjs \
            --site .pages-site \
            --dist /tmp/docs-channel \
            --id ${{ steps.channel.outputs.channel }} \
            --label ${{ steps.channel.outputs.channel }} \
            --kind channel \
            --path "channels/${{ steps.channel.outputs.channel }}/" \
            --version ${{ needs.release.outputs.new_release_git_tag }}

      - name: Set default target for stable channel
        if: steps.channel.outputs.channel == 'prod'
        run: |
          node scripts/docs/merge-versioned-site.mjs \
            --site .pages-site \
            --dist /tmp/docs-channel \
            --id prod \
            --label prod \
            --kind channel \
            --path channels/prod/ \
            --version ${{ needs.release.outputs.new_release_git_tag }} \
            --default-target channels/prod/

      - name: Apply prerelease retention policy
        run: |
          node scripts/docs/apply-retention.mjs \
            --site .pages-site \
            --keep-prerelease 12

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-marketplace:
    name: Publish Extension Marketplaces
    runs-on: ubuntu-latest
    environment:
      name: production
    needs: release
    if: needs.release.outputs.new_release_published == 'true' && github.ref_name == 'main'
    permissions:
      contents: read
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.new_release_git_tag }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and package VSIX
        run: |
          pnpm --filter omni-cad run compile
          pnpm --filter omni-cad run package

      - name: Resolve VSIX path
        id: vsix
        run: |
          file=$(ls packages/extension/*.vsix | head -n 1)
          echo "path=$file" >> "$GITHUB_OUTPUT"

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: pnpm exec vsce publish --packagePath "${{ steps.vsix.outputs.path }}" -p "$VSCE_PAT"

      - name: Skip VS Code Marketplace publish
        if: env.VSCE_PAT == ''
        run: echo "VSCE_PAT is not configured. Skipping VS Code Marketplace publish."

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: pnpm dlx ovsx publish "${{ steps.vsix.outputs.path }}" -p "$OVSX_PAT"

      - name: Skip Open VSX publish
        if: env.OVSX_PAT == ''
        run: echo "OVSX_PAT is not configured. Skipping Open VSX publish."
